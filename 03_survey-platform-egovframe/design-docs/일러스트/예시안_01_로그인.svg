<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- [A대학교] 서베이 일러스트 예시안 ① 로그인 (4:3) — 잉크 #0A336F / 강조 #00643D / 면 #D9E2F0 -->

  <!-- 잎가지 (좌상단) -->
  <g transform="rotate(-6 160 140)" stroke="#0A336F" stroke-width="5" stroke-linecap="round">
    <path d="M150 215 C 138 160, 150 105, 180 68" fill="none"/>
    <ellipse cx="128" cy="180" rx="26" ry="12" transform="rotate(-38 128 180)" fill="#00643D"/>
    <ellipse cx="178" cy="150" rx="26" ry="12" transform="rotate(28 178 150)" fill="#00643D"/>
    <ellipse cx="122" cy="122" rx="24" ry="11" transform="rotate(-30 122 122)" fill="#00643D"/>
    <ellipse cx="188" cy="95" rx="24" ry="11" transform="rotate(34 188 95)" fill="#00643D"/>
  </g>

  <!-- 클립보드 -->
  <g transform="rotate(2 415 300)">
    <rect x="270" y="95" width="290" height="430" rx="18" fill="#D9E2F0" stroke="#0A336F" stroke-width="6"/>
    <rect x="295" y="138" width="240" height="356" rx="8" fill="#FFFFFF" stroke="#0A336F" stroke-width="5"/>
    <rect x="375" y="70" width="80" height="38" rx="12" fill="#FFFFFF" stroke="#0A336F" stroke-width="6"/>
    <circle cx="415" cy="89" r="7" fill="#D9E2F0" stroke="#0A336F" stroke-width="5"/>

    <!-- 제목 줄 -->
    <line x1="322" y1="180" x2="438" y2="180" stroke="#0A336F" stroke-width="9" stroke-linecap="round"/>
    <line x1="322" y1="202" x2="378" y2="202" stroke="#00643D" stroke-width="6" stroke-linecap="round"/>

    <!-- 문항 1 (체크됨) -->
    <rect x="320" y="238" width="32" height="32" rx="7" fill="#FFFFFF" stroke="#0A336F" stroke-width="5"/>
    <path d="M327 254 L336 264 L354 240" fill="none" stroke="#00643D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="370" y1="246" x2="500" y2="246" stroke="#0A336F" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="266" x2="458" y2="266" stroke="#D9E2F0" stroke-width="5" stroke-linecap="round"/>

    <!-- 문항 2 (체크됨) -->
    <rect x="320" y="312" width="32" height="32" rx="7" fill="#FFFFFF" stroke="#0A336F" stroke-width="5"/>
    <path d="M327 328 L336 338 L354 314" fill="none" stroke="#00643D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="370" y1="320" x2="492" y2="320" stroke="#0A336F" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="340" x2="470" y2="340" stroke="#D9E2F0" stroke-width="5" stroke-linecap="round"/>

    <!-- 문항 3 (미체크) -->
    <rect x="320" y="386" width="32" height="32" rx="7" fill="#FFFFFF" stroke="#0A336F" stroke-width="5"/>
    <line x1="370" y1="394" x2="486" y2="394" stroke="#0A336F" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="414" x2="446" y2="414" stroke="#D9E2F0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 연필 (우측, 종이에 걸침) -->
  <g transform="rotate(-42 600 420)">
    <rect x="578" y="300" width="38" height="170" rx="8" fill="#FFFFFF" stroke="#0A336F" stroke-width="6"/>
    <rect x="578" y="272" width="38" height="30" rx="8" fill="#00643D" stroke="#0A336F" stroke-width="6"/>
    <path d="M578 470 L597 522 L616 470 Z" fill="#D9E2F0" stroke="#0A336F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M591 505 L597 522 L603 505 Z" fill="#0A336F"/>
  </g>

  <!-- 커피잔 (좌하단) -->
  <g>
    <ellipse cx="165" cy="520" rx="72" ry="14" fill="#D9E2F0" stroke="#0A336F" stroke-width="5"/>
    <path d="M115 438 L215 438 L207 502 Q165 518 123 502 Z" fill="#FFFFFF" stroke="#0A336F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M215 450 Q250 458 212 488" fill="none" stroke="#0A336F" stroke-width="6" stroke-linecap="round"/>
    <line x1="122" y1="468" x2="208" y2="468" stroke="#00643D" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 414 q9 -13 0 -25 q-9 -12 0 -24" fill="none" stroke="#0A336F" stroke-width="5" stroke-linecap="round"/>
    <path d="M182 414 q9 -13 0 -25" fill="none" stroke="#0A336F" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 반짝임 (초록 십자) -->
  <g stroke="#00643D" stroke-width="6" stroke-linecap="round">
    <line x1="243" y1="72" x2="243" y2="96"/><line x1="231" y1="84" x2="255" y2="84"/>
    <line x1="648" y1="160" x2="648" y2="184"/><line x1="636" y1="172" x2="660" y2="172"/>
    <line x1="680" y1="512" x2="680" y2="536"/><line x1="668" y1="524" x2="692" y2="524"/>
  </g>
</svg>
