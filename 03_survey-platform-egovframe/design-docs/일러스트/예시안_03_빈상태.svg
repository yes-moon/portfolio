<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- [A대학교] 서베이 일러스트 예시안 ③ 빈 상태 (1:1, 최소 디테일) — 잉크 #0A336F / 강조 #00643D / 면 #D9E2F0 -->

  <!-- 바닥선 -->
  <line x1="130" y1="472" x2="470" y2="472" stroke="#0A336F" stroke-width="6" stroke-linecap="round"/>

  <!-- 빈 서류 트레이 -->
  <g>
    <path d="M150 322 L450 322 L428 462 L172 462 Z" fill="#D9E2F0" stroke="#0A336F" stroke-width="6" stroke-linejoin="round"/>
    <path d="M192 322 L408 322 L399 350 L201 350 Z" fill="#FFFFFF" stroke="#0A336F" stroke-width="5" stroke-linejoin="round"/>
    <line x1="228" y1="404" x2="372" y2="404" stroke="#0A336F" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- 비어 있음 (점선 원) -->
  <circle cx="300" cy="205" r="50" fill="none" stroke="#0A336F" stroke-width="5" stroke-dasharray="1 16" stroke-linecap="round"/>

  <!-- 돋보기 (기대 세움) -->
  <g transform="rotate(18 452 370)">
    <rect x="440" y="392" width="22" height="74" rx="11" fill="#D9E2F0" stroke="#0A336F" stroke-width="6"/>
    <circle cx="451" cy="344" r="52" fill="#FFFFFF" stroke="#0A336F" stroke-width="6"/>
    <path d="M424 326 A 36 36 0 0 1 448 310" fill="none" stroke="#00643D" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 반짝임 -->
  <g stroke="#00643D" stroke-width="6" stroke-linecap="round">
    <line x1="182" y1="196" x2="182" y2="220"/><line x1="170" y1="208" x2="194" y2="208"/>
  </g>
  <circle cx="392" cy="150" r="7" fill="none" stroke="#0A336F" stroke-width="5"/>
</svg>
